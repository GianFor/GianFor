<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Gianrico Fornari — explainable graph ML, retrieval, evaluation">
  <title>Gianrico Fornari — explainable graph ML, retrieval, evaluation</title>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="66" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="3.6" fill="#0969da">MACHINE LEARNING · RESEARCH · VIDEO</text>
    <text x="46" y="120" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#1f2328">Gianrico Fornari</text>
    <text x="48" y="154" font-size="17" fill="#1f2328" opacity="0.9">MSc Data Science &amp; Engineering @ Politecnico di Torino</text>
    <text x="48" y="180" font-size="14.5" fill="#59636e">Research assistant — XAI for graph neural networks, University of L'Aquila</text>
  </g>

  <g stroke-linecap="round">
    <!-- factual graph G -->
    <g stroke="#c2cbd4" stroke-width="1.9">
      <line x1="830" y1="115" x2="830" y2="60"/>
      <line x1="830" y1="115" x2="778" y2="98"/>
      <line x1="830" y1="115" x2="882" y2="98"/>
      <line x1="830" y1="115" x2="798" y2="160"/>
      <line x1="830" y1="115" x2="862" y2="160"/>
      <line x1="778" y1="98" x2="798" y2="160"/>
      <line x1="882" y1="98" x2="862" y2="160"/>
      <line x1="830" y1="60" x2="882" y2="98"/>
    </g>
    <g fill="#ffffff" stroke="#59636e" stroke-width="1.6">
      <circle cx="830" cy="60" r="8.5"/>
      <circle cx="778" cy="98" r="8.5"/>
      <circle cx="882" cy="98" r="8.5"/>
      <circle cx="798" cy="160" r="8.5"/>
      <circle cx="862" cy="160" r="8.5"/>
    </g>
    <circle cx="830" cy="115" r="11" fill="#0969da" stroke="#0969da" stroke-width="1.6"/>

    <!-- counterfactual graph G' -->
    <g stroke="#c2cbd4" stroke-width="1.9">
      <line x1="1070" y1="115" x2="1070" y2="60"/>
      <line x1="1070" y1="115" x2="1018" y2="98"/>
      <line x1="1070" y1="115" x2="1038" y2="160"/>
      <line x1="1070" y1="115" x2="1102" y2="160"/>
      <line x1="1018" y1="98" x2="1038" y2="160"/>
      <line x1="1122" y1="98" x2="1102" y2="160"/>
      <line x1="1070" y1="60" x2="1122" y2="98"/>
    </g>
    <line x1="1070" y1="115" x2="1122" y2="98" stroke="#bc4c00" stroke-width="2" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" values="18;0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <g fill="#ffffff" stroke="#59636e" stroke-width="1.6">
      <circle cx="1070" cy="60" r="8.5"/>
      <circle cx="1018" cy="98" r="8.5"/>
      <circle cx="1122" cy="98" r="8.5"/>
      <circle cx="1038" cy="160" r="8.5"/>
      <circle cx="1102" cy="160" r="8.5"/>
    </g>
    <circle cx="1070" cy="115" r="11" fill="#bc4c00" stroke="#bc4c00" stroke-width="1.6"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="950" y="100" font-size="10.5" letter-spacing="1.4" fill="#59636e" text-anchor="middle">counterfactual</text>
    <path d="M912 115 H982" stroke="#59636e" stroke-width="1.4"/>
    <path d="M976 110 L983 115 L976 120" fill="none" stroke="#59636e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="950" y="136" font-size="10.5" letter-spacing="1.2" fill="#bc4c00" text-anchor="middle">Δ = −1 edge</text>
    <text x="830" y="200" font-size="12" fill="#59636e" text-anchor="middle">G</text>
    <text x="1070" y="200" font-size="12" fill="#59636e" text-anchor="middle">G′</text>
  </g>
</svg>
